name: SIFI Engineering Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deterministic-verification:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile source
        shell: pwsh
        run: |
          python -m compileall -q src tests

      - name: Verify historical evidence availability
        shell: pwsh
        run: |
          $required = @(
            "0f67266437260b192dc8e9361aa2eb42ff112c34",
            "45dcb1f615daafcb169f52daef8e56b41723c8a3",
            "92a67eb9863e30907b7461c2bb64030fd8868cc1",
            "0f7a8caf4c37fe65ffa7c7e88e1eca1adc52faa7",
            "302f21b1efe8e29f49a19cc6130c1d62278be85e",
            "b322db1108e174567b2991cf4e53154f30ec3531"
          )

          foreach ($commit in $required) {
            git cat-file -e "$commit^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Required historical commit unavailable: $commit"
            }
          }

          Write-Host "HISTORICAL_EVIDENCE_AVAILABLE=PASS"

      - name: Run deterministic test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Governance boundary check
        shell: pwsh
        run: |
          $forbiddenPatterns = @(
            '^runtime/',
            '^logs/',
            '^data/raw/',
            '^data/private/'
          )

          $tracked = @(git ls-files)

          foreach ($pattern in $forbiddenPatterns) {
            $matches = @($tracked | Where-Object { $_ -match $pattern })

            if ($matches.Count -gt 0) {
              Write-Host "FORBIDDEN_TRACKED_PATHS:"
              $matches
              throw "Forbidden tracked governance surface detected: $pattern"
            }
          }

          Write-Host "CI_GOVERNANCE_BOUNDARY=PASS"

      - name: CB22 non-claim boundary
        shell: pwsh
        run: |
          Write-Host "CB22_COUNTED_EXECUTION=PROHIBITED_IN_CI"
          Write-Host "CB22_FINAL_ADJUDICATION=PROHIBITED_IN_CI"
          Write-Host "LIVE_ACQUISITION=PROHIBITED_IN_CI"
          Write-Host "PRODUCTION_ACTIVATION=PROHIBITED_IN_CI"